problem:
  name: quadratic
  data_path: data/quadratic_spd.npz

arsn:
  max_iter: 200
  tol_grad: 1.0e-6
  s: 50
  beta: 1.0e-4
  tau: 0.5
  alpha0: 1.0
  max_ls_iters: 50
  seed: 0
  verbose: true
  print_every: 20

inner:
  method: rk
  rk:
    T: 200
    r: 100
    ridge: 1.0e-12
    minres_tol: 1.0e-6
    minres_maxit: 200
    warm_start: true

regularizer:
  method: diag_shift
  diag_shift:
    c1: 0
    c2: 0
    gamma: 0.5

sketch:
  mode: operator
  block_size: 256
  dtype: float64

output:
  dir: outputs
  run_name: example_quadratic
  csv_name: result.csv

logging:
  record_columns: null
