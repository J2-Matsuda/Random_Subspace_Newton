seed: 0
experiment_name: "rk_rsrn_logreg_sr50L100"
problem:
  key: "logistic_regression"
  params:
    dim: 1000
    n_samples: 5000
    seed: 0
    intercept: 0.0
algorithm:
  key: "rk_rsrnm"
  params:
    max_iters: 2000
    tol: 1.0e-8
    t0: 1.0
    alpha: 1.0e-4
    beta: 0.5
    s: 50
    rs_reg: 0.0
    r: 50
    L: 100
    rk_reg: 0.0
    warm_start: true
logging:
  include_timestamp: false
  save_plot: true
  csv_metrics: ["k", "f", "grad_norm", "t_k", "rk_residual"]
  plot_metrics: ["grad_norm", "f", "t_k", "rk_residual"]
  debug: false
  debug_csv: "log/rk_rsrn_debug/run_debug.csv"
